# MSSQL Database -> PRIMARY
spring.mssql.datasource.jdbc-url=jdbc:sqlserver://mssql-server:1435;databaseName=serMonDB;encrypt=true;trustServerCertificate=true
spring.mssql.datasource.username=sa
spring.mssql.datasource.password=Admin@123
spring.mssql.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.mssql.jpa.hibernate.ddl-auto=validate
spring.mssql.jpa.show-sql=true
spring.mssql.jpa.properties.hibernate.format_sql=true
spring.mssql.datasource.hikari.schema=dbo



# MSSQL Connection Pool Performance
spring.mssql.datasource.hikari.maximum-pool-size=10
spring.mssql.datasource.hikari.minimum-idle=10
spring.mssql.datasource.hikari.pool-name=MSSQL-Pool


spring.mssql.datasource.hikari.max-lifetime=1800000
spring.mssql.datasource.hikari.keepalive-time=300000



logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=DEBUG


# ===================================================================
# METRICS DATABASE CONFIGURATION (TimescaleDB via JDBC)
# ===================================================================
spring.timescaledb.datasource.jdbc-url=jdbc:postgresql://timescaledb:5432/serMonTimescaleDB
spring.timescaledb.datasource.username=sermon_admin
spring.timescaledb.datasource.password=Admin@123
spring.timescaledb.datasource.driver-class-name=org.postgresql.Driver
spring.timescaledb.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.timescaledb.datasource.hikari.schema=public

# TimescaleDB Connection Pool Performance (Optimized for heavy batch appending)
spring.timescaledb.datasource.hikari.maximum-pool-size=50
spring.timescaledb.datasource.hikari.pool-name=Timescale-Pool



spring.timescaledb.datasource.hikari.max-lifetime=1800000
